services:
  - type: web
    name: quickly
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: QUICKLY_TELEMETRY
        value: "false"
      - key: QUICKLY_MODE
        value: production
      # Web-only instance; the scheduler runs on another host.
      - key: QUICKLY_SCHEDULER_ENABLED
        value: "false"
      # Provided manually in the Render dashboard (no Postgres in this blueprint):
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QUICKLY_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
